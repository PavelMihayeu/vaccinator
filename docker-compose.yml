version: "3.8"

services:
  db:
    image: postgres:15
    container_name: vaccinator-db
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - vaccinator-net

  app:
    build: .
    container_name: vaccinator-app
    env_file: .env
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      API_KEY_SECRET: ${API_KEY_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - vaccinator-net

volumes:
  pgdata:

networks:
  vaccinator-net:
