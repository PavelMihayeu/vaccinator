version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: vaccinator-mongodb
    environment:
      MONGO_INITDB_DATABASE: vaccinator_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - vaccinator-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    image: migaeff/vaccinator-api:latest
    container_name: vaccinator-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: vaccinator_db
    ports:
      - "80:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - vaccinator-net
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  vaccinator-net:
    driver: bridge
