# Docker Profile Configuration

# MongoDB Configuration for Docker
spring.data.mongodb.host=mongodb
spring.data.mongodb.port=27017
spring.data.mongodb.database=vaccinator_db

# PostgreSQL Configuration for Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/vaccinator_db
spring.datasource.username=vaccinator_user
spring.datasource.password=vaccinator_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
server.address=0.0.0.0

# OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-models-expand-depth=-1

# Error Handling Configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Logging
logging.level.com.endevitylabs.vaccinator=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.data.jpa=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# API Key Configuration
app.api.key=${API_KEY_SECRET:your-super-secret-api-key-here-change-in-production}
app.api.key.header=X-API-Key

# API Version Configuration
app.api.version=${API_VERSION:1.0} 