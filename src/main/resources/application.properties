spring.application.name=vaccinator

# Server Configuration
server.port=8080

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=vaccinator_db

# PostgreSQL Configuration (Commented out - PreQualified vaccines now use MongoDB)
# spring.datasource.url=jdbc:postgresql://localhost:5432/vaccinator_db
# spring.datasource.username=vaccinator_user
# spring.datasource.password=vaccinator_password
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration (Commented out - PreQualified vaccines now use MongoDB)
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.format_sql=true

# OpenAPI 3.1.1 Configuration (SpringDoc 2.8.9)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-models-expand-depth=-1

# Error Handling Configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# API Key Configuration
app.api.key=${API_KEY_SECRET:your-super-secret-api-key-here-change-in-production}
app.api.key.header=X-API-Key

# API Version Configuration
app.api.version=${API_VERSION:1.0}

# JWT (kept for compatibility)
jwt.secret=${JWT_SECRET:9FbdZ8HyYkRcN6F9ghKiFjK8RmXEhOuf+U3US82O+ZY=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.org.springdoc=DEBUG
logging.level.org.springdoc.api.OpenApiResource=DEBUG