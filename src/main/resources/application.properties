spring.application.name=vaccinator

# Server Configuration
server.port=8080

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=vaccinator_db

# OpenAPI 3.1.1 Configuration (SpringDoc 2.8.9)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Error Handling Configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# API Key Configuration
api.key.secret=${API_KEY_SECRET:your-super-secret-api-key-here-change-in-production}

# JWT (kept for compatibility)
jwt.secret=${JWT_SECRET:9FbdZ8HyYkRcN6F9ghKiFjK8RmXEhOuf+U3US82O+ZY=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.org.springdoc=DEBUG
logging.level.org.springdoc.api.OpenApiResource=DEBUG