spring.application.name=vaccinator

# PostgreSQL DB Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# OpenAPI / Swagger Config
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# API Key Configuration
api.key.secret=${API_KEY_SECRET:your-super-secret-api-key-here-change-in-production}

# JWT (kept for compatibility)
jwt.secret=${JWT_SECRET:9FbdZ8HyYkRcN6F9ghKiFjK8RmXEhOuf+U3US82O+ZY=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}