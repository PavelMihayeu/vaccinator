spring.application.name=vaccinator

# PostgreSQL DB Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# Virtual threads
spring.threads.virtual.enabled=true
spring.thread-executor=virtual

# Cache Configuration
spring.cache.type=caffeine
spring.cache.cache-names=vaccines,whoGuidelineSummary
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m

# OpenAPI 3.1.1 Configuration (SpringDoc 2.8.9)

# API Key Configuration
api.key.secret=${API_KEY_SECRET:your-super-secret-api-key-here-change-in-production}

# JWT (kept for compatibility)
jwt.secret=${JWT_SECRET:9FbdZ8HyYkRcN6F9ghKiFjK8RmXEhOuf+U3US82O+ZY=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.org.springdoc=DEBUG
logging.level.org.springdoc.api.OpenApiResource=DEBUG