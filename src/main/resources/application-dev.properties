# Development Profile Configuration

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=vaccinator_db

# OpenAPI Configuration (SpringDoc 2.8.9)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.api-docs.version=OPENAPI_3_1

# API Key Configuration (for development)
api.key.secret=dev-api-key-123

# API Version Configuration (for development)
app.api.version=1.0

# JWT (for development)
jwt.secret=dev-jwt-secret-key-123
jwt.expiration-ms=86400000

# Logging
logging.level.org.springdoc=DEBUG
logging.level.org.springdoc.api.OpenApiResource=DEBUG
logging.level.com.endevitylabs.vaccinator=DEBUG

# Server Configuration
server.address=0.0.0.0