version: '3.8'

services:
  db:
    image: postgres:15
    container_name: vaccinator-db-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaccinator}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vaccinator-net

volumes:
  postgres_data:

networks:
  vaccinator-net:
    driver: bridge 